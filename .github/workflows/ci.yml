name: CI

on:
  # ⚠️ THE PUSH TRIGGER IS GONE, AND IT WAS REMOVED FOR COST — NOT BECAUSE IT WAS WRONG.
  #
  # WHAT WAS TRUE BEFORE, in this file's own words: "A direct push to main used to run NOTHING — only PRs were
  # checked. Both triggers now, so main is never unverified." That reasoning was RIGHT and the gap it named was
  # real; this is a trade, not a correction.
  #
  # WHAT IS TRUE NOW: this team merges DIRECTLY to main — PR-to-main has not been adopted, deliberately, to keep
  # speed — so `push: branches: [main]` fired on essentially every commit, in FOUR repositories at once, and
  # GitHub Actions credits were going faster than this stage of the product can justify. The operator decided on
  # 2026-09-03 to buy the cost back at a known price.
  #
  # ⚠️ AND THE PRICE IS WRITTEN HERE SO NOBODY HAS TO REDISCOVER IT: MAIN IS NOW UNVERIFIED BETWEEN PRs. A direct
  # commit to main runs nothing at all. What replaces the trigger is a PERSON: `workflow_dispatch` puts a "Run
  # workflow" button on the Actions tab, and the rule is to press it on main before a deploy. That is weaker than
  # a trigger and is meant to read as weaker — a reason that lives only in whoever decided it has no reader.
  # PR-to-main, a nightly `schedule:`, or a pre-push hook would each make it safe again. None is built here.
  workflow_dispatch:
  # ⚠️ AND THE SENTENCE THAT USED TO STAND ABOVE THIS BLOCK IS GONE FOR THE SAME REASON: "push AND
  # pull_request, matching the other three repos, so main is never unverified." All four repositories made the
  # same trade on the same day, so they still match — on the new shape.
  #
  # This `pull_request:` carries NO `branches` and NO `types`, where the other three name both. That difference
  # predates this slice and is not this slice's to resolve; it is recorded rather than tidied, because a trigger
  # filter is a decision about which PRs get checked and changing it here would be a second change wearing this
  # one's clothes.
  pull_request:

# ONE RUN PER WORKFLOW PER REF, and a superseded one stops instead of finishing.
#
# WHAT IT CANCELS: an earlier run for the SAME ref — a PR whose second push lands while the first run is still
# going, or a second press of the Run workflow button on the same branch. Nobody is waiting on the verdict for a
# commit that has already been replaced.
#
# ⚠️ WHAT IT DOES NOT CANCEL, said plainly so this does not read as a second cost lever quietly dropping results
# somebody wanted: a run for a DIFFERENT ref is untouched. Two open PRs never cancel each other, and a dispatch
# on main is not cancelled by a PR. The one case where an answer you may have wanted disappears is pressing the
# button twice on the same ref — and there the second press is the one that answers.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# READ ONLY, AND EVERY ACTION NAMED BY ITS COMMIT. CI builds and tests; it writes nothing, so it asks for nothing
# more than reading the tree, instead of the repository's default token. The SHAs are the commits the v4 and v5 tags
# pointed at on 2026-10-20 — see release.yml.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Every job ends on its own (CI_THAT_ALWAYS_ENDS): a job with none runs to GitHub's 360-minute default, and a sibling
    # repository's run sat 22 minutes in a step that had printed its results (2026-10-30). Build, vet and `go test -race`;
    # 30 is generous, and each step carries its own so the log names the one that stopped.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # ONE HOME for the Go version: go.mod. Nothing here to drift from it.
          go-version-file: go.mod
      - run: go build ./...
        timeout-minutes: 10
      - run: go vet ./...
        timeout-minutes: 10
      - run: go test ./... -race
        timeout-minutes: 20

  # THE UNIT TESTS ON WINDOWS (AN_AGENT_THAT_DRIVES_ANDROID_ON_ANY_MACHINE): the agent is built for Windows now, and the code
  # that only Windows runs — the owner of a loopback connection (internal/netcap/peer_windows.go), the locks, the private
  # files' access list, the console — is tested where it runs, against the real system calls. Build, vet and `go test`,
  # like the job above, WITHOUT -race: the race detector on Windows needs cgo and a C compiler on the runner and roughly
  # doubles the run, and the code it would watch for races is the same code the ubuntu job already runs under -race;
  # the Windows-only files start no goroutine of their own.
  #
  # Tests that exercise a Unix-only tool — a shell-script fake, a workflow step run in bash, a Unix signal or file mode —
  # skip here and say which; they run in the job above.
  windows-unit-tests:
    runs-on: windows-latest
    # Every job ends on its own (CI_THAT_ALWAYS_ENDS).
    timeout-minutes: 30
    steps:
      # LINE ENDINGS AS EVERY OTHER RUNNER CHECKS THEM OUT. Git for Windows turns LF into CRLF on checkout by default, and
      # the goldens, the README and workflow seals and the toolchain-copy comparison read the bytes the repository holds.
      # Set for this job's git, before the checkout.
      - run: git config --global core.autocrlf false
        timeout-minutes: 2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go build ./...
        timeout-minutes: 10
      - run: go vet ./...
        timeout-minutes: 10
      - run: go test ./...
        timeout-minutes: 20
      # PASS, NOT SKIP (AN_AGENT_THAT_PASSES_ON_WINDOWS_ROUND_TWO). Without -v, `go test` says `ok` for a package whose tests
      # skipped exactly as for one whose tests passed, and the tests below run nowhere but here: on any other system they skip,
      # or are not built at all. So they run again by name, with -v, and the job fails unless each one says PASS. A SKIP, a
      # FAIL, or a name that no longer runs fails it. The list is the tree's own: cmd/nth-agent's
      # TestTheWindowsJobNamesEveryTestThatRunsOnlyOnWindows holds it to every test that runs only on Windows.
      - name: The Windows-only tests passed, not skipped
        timeout-minutes: 10
        shell: bash
        run: |
          tests=(
            TestOnWindowsAPrivateFileListsThisAccountAlone
            TestOnWindowsALockIsHeldByOneHandleAtATime
            TestOnWindowsAProjectInstallIsReadFromWhereItsProgramIs
            TestWindowsNamesThisAccountBehindItsOwnLoopbackConnection
          )
          pattern="^($(IFS='|'; echo "${tests[*]}"))\$"
          ran=0
          go test -count=1 -v -run "$pattern" ./internal/private/ ./internal/command/ ./internal/netcap/ | tee windows-only.txt || ran=$?
          failed=0
          for test in "${tests[@]}"; do
            if grep -q "^--- PASS: $test " windows-only.txt; then
              echo "PASS $test"
            elif grep -q "^--- SKIP: $test " windows-only.txt; then
              echo "::error::$test was skipped on Windows, the one system it runs on"
              failed=1
            elif grep -q "^--- FAIL: $test " windows-only.txt; then
              echo "::error::$test failed"
              failed=1
            else
              echo "::error::$test did not run: no test of that name in the packages named here"
              failed=1
            fi
          done
          exit $(( ran != 0 || failed != 0 ))

  cross-compile:
    runs-on: ubuntu-latest
    # Every job ends on its own (CI_THAT_ALWAYS_ENDS): one `go build` per target.
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # The targets we compile are exactly the targets this repo may claim (see the platform-claims
      # seal in internal/inventory): when we add a target we add the sentence, not before. Windows and
      # Linux on arm64 joined on 2026-11-03 (AN_AGENT_THAT_DRIVES_ANDROID_ON_ANY_MACHINE), with the
      # README's and the CHANGELOG's sentences.
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
        timeout-minutes: 10
